<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAAI Options</title>
</head>

<body>
    <header class="panel-section panel-section-header">
        <div class="text-section-header">Aria2 Profiles</div>
    </header>

    <div class="panel-section panel-section-formElements">
        <div class="panel-formElements-item" style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
            <label for="profile-select" style="min-width: 60px;">Profile</label>
            <select id="profile-select" class="browser-style" style="flex: 1 1 180px; min-width: 140px;"></select>
            <button type="button" id="new-profile-btn" class="browser-style">New</button>
            <button type="button" id="make-default-btn" class="browser-style">Set as Default</button>
            <button type="button" id="delete-profile-btn" class="browser-style" style="color: #c00;">Delete</button>
        </div>
        <div id="profile-badge" style="font-size: 0.85em; color: #0060df; font-weight: 500; margin-left: 70px; min-height: 1.2em;"></div>
    </div>

    <header class="panel-section panel-section-header">
        <div class="text-section-header">Server Settings</div>
    </header>

    <form id="aria2-options" class="panel-section panel-section-formElements">
        <div class="panel-formElements-item">
            <label for="name">Profile Name</label>
            <input type="text" class="option aria2" name="name" id="name" required>
        </div>
        <div class="panel-formElements-item">
            <label for="host">Host</label>
            <input type="text" class="option aria2" name="host" id="host" required>
        </div>
        <div class="panel-formElements-item">
            <label for="port">Port</label>
            <input type="number" min="0" max="65535" class="option aria2" name="port" id="port" required>
        </div>
        <fieldset class="panel-formElements-item">
            <legend>Protocol</legend>
            <label for="protocol-ws">WS</label>
            <input type="radio" class="option aria2" name="protocol" id="protocol-ws" value="ws">
            <label for="protocol-http">HTTP</label>
            <input type="radio" class="option aria2" name="protocol" id="protocol-http" value="http">
        </fieldset>

        <div class="panel-formElements-item">
            <label for="secure">Secure</label>
            <input type="checkbox" class="option aria2" name="secure" id="secure">
        </div>
        <div class="panel-formElements-item">
            <label for="path">Path</label>
            <input type="text" class="option aria2" name="path" id="path">
        </div>
        <div class="panel-formElements-item">
            <label for="secret">RPC Secret Token</label>
            <input type="password" class="option aria2" name="secret" id="secret">
        </div>
        <div class="panel-formElements-item">
            <label for="dir">Default Directory</label>
            <input type="text" class="option aria2" name="dir" id="dir" placeholder="Server default (leave blank for Aria2 global dir)">
        </div>
        <div class="panel-formElements-item">
            <label>Recent Directories</label>
            <div style="flex: 1 1 auto;">
                <div id="recent-dirs-container" style="font-size: 0.9em; color: #555; margin-bottom: 6px; word-break: break-all;">(None)</div>
                <button type="button" id="clear-history-btn" class="browser-style" style="font-size: 0.85em;">Clear History</button>
            </div>
        </div>

        <div class="panel-formElements-item" style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px;">
            <button type="button" id="test-connection-btn" class="browser-style">Test Connection</button>
            <button type="submit" id="save-btn" class="browser-style default">Save Profile</button>
        </div>
        <div id="status-message" style="margin-top: 10px; font-weight: 500; min-height: 1.5em; text-align: center;"></div>
    </form>
    <script type="module" src="index.js"></script>
</body>

</html>
